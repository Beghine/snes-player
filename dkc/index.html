<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogar SNES</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      height: 100vh;
      max-width: 100%;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    .ejs_start_button {
      bottom: 110px !important;
    }
    .ejs_virtualGamepad_parent {
      transform: translateY(-60px);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    // ===== CONFIGURAÇÃO =====
    // Troque o caminho abaixo pela sua ROM (formato .zip, .smc ou .sfc)
    EJS_player = "#game";
    EJS_core = "snes";                     // core do SNES (snes9x)
    EJS_gameName = "Donkey Kong Country";     // nome exibido no emulador
    EJS_gameUrl = "roms/dkc.zip";           // <-- caminho da sua ROM aqui
    EJS_backgroundImage = "dkc.jpg"; // nome do arquivo que você subiu
    EJS_backgroundBlur = true;         // deixa um efeito de fundo desfocado ao redor, se a imagem não preencher a tela toda
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

    // Opcional: cor de destaque da interface do emulador
    EJS_color = "#e60012";

    // Opcional: iniciar automaticamente sem tela de "play"
    // EJS_startOnLoaded = true;
    EJS_fullscreenOnLoaded = true;

   EJS_fullscreenOnLoaded = false; // deixa false, controlamos manualmente

EJS_onGameStart = function() {
  document.body.classList.add('game-started');

  // tenta travar a orientação em paisagem (funciona no Android/Chrome)
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(function(e) {
      console.log('Não foi possível travar a orientação:', e);
    });
  }
};
    @media screen and (max-width: 926px) and (orientation: portrait) {
  body.game-started #game-container {
    transform: rotate(90deg);
    transform-origin: left top;
    width: 100vh;
    height: 100vw;
    position: absolute;
    top: 100%;
    left: 0;
  }
}
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
