<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Donkey Kong Country</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100vh;
      max-width: 100%;
    }
    #game {
      width: 100%;
      height: 100%;
    }

    /* ===== Esconde a UI padrão do EmulatorJS até o jogo começar ===== */
    .ejs_game_background,
    .ejs_start_button {
      display: none !important;
    }

    /* ===== Tela de capa customizada ===== */
    #custom-cover {
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #custom-cover .card {
      background: #1a1a1a;
      border-radius: 28px;
      padding: 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    #custom-cover .art {
      width: 100%;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      display: block;
      margin-bottom: 20px;
    }
    #custom-cover h1 {
      color: #fff;
      font-size: 22px;
      margin: 0 0 8px;
    }
    #custom-cover p {
      color: #999;
      font-size: 14px;
      margin: 0 0 22px;
      line-height: 1.4;
    }
    #custom-cover button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff3b30, #d81f14);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(216,31,20,0.5);
    }
    #custom-cover button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game"></div>
  </div>

  <!-- ===== Tela de capa customizada ===== -->
  <div id="custom-cover">
    <div class="card">
      <img class="art" src="capadkc.jpg" alt="Capa do jogo">
      <h1>Donkey Kong Country</h1>
      <p>Ligue um gamepad Bluetooth ou use os controles touch.</p>
      <button id="custom-start-btn">START GAME</button>
    </div>
  </div>

  <script>
    EJS_player = "#game";
    EJS_core = "snes";
    EJS_gameName = "Donkey Kong Country";
    EJS_gameUrl = "roms/dkc.zip";
    EJS_backgroundImage = "capadkc.jpg";
    EJS_backgroundBlur = true;
    EJS_alignStartButton = "center";
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    EJS_color = "#e60012";

    // Quando o EmulatorJS terminar de montar a tela inicial,
    // conectamos nosso botão customizado ao botão real dele.
    EJS_onLoadEntered = function() {};

    function tentarConectarBotao() {
      var realBtn = document.querySelector(".ejs_start_button");
      var customBtn = document.getElementById("custom-start-btn");
      var cover = document.getElementById("custom-cover");

      if (realBtn && customBtn) {
        customBtn.addEventListener("click", function () {
          realBtn.click();       // dispara o start real do emulador
          cover.style.display = "none"; // esconde nossa capa
        });
      } else {
        // o botão real do EJS pode demorar a existir; tenta de novo em breve
        setTimeout(tentarConectarBotao, 200);
      }
    }
    tentarConectarBotao();
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
