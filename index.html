<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogar SNES</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      height: 100vh;
      max-width: 100%;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    // ===== CONFIGURAÇÃO =====
    // Troque o caminho abaixo pela sua ROM (formato .zip, .smc ou .sfc)
    EJS_player = "#game";
    EJS_core = "snes";                     // core do SNES (snes9x)
    EJS_gameName = "Super Mario World";     // nome exibido no emulador
    EJS_gameUrl = "roms/smw.zip";           // <-- caminho da sua ROM aqui
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

    // Opcional: cor de destaque da interface do emulador
    EJS_color = "#e60012";

    // Opcional: iniciar automaticamente sem tela de "play"
    // EJS_startOnLoaded = true;
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
